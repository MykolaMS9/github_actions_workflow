name: Smoke (DinD socket)
on: [push, pull_request]

jobs:
  test:
    runs-on: [self-hosted, hetzner]

    container:
      image: ubuntu:24.04
      env:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_HOST: unix:///run/docker.sock
      options: >-
        -v dind-run:/var/run

    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --group-add 2375
          -v dind-run:/var/run
          -v dind-storage:/var/lib/docker

    steps:
    - uses: actions/checkout@v4

    - name: Install Docker CLI in job container
      run: |
        apt-get update -qq
        apt-get install -y docker.io ca-certificates curl git

    - name: Wait for DinD (socket)
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      run: |
        for i in $(seq 1 30); do
          if [ -S /var/run/docker.sock ] && docker version >/dev/null 2>&1; then
            echo "dockerd is up"; exit 0
          fi
          ls -l /var/run/docker.sock || true
          echo "waiting ($i/30)…"
          sleep 2
        done
        exit 1

    - name: Docker reachable?
      run: docker version && docker info | head -20

    - name: Create helper Dockerfile
      run: |
        mkdir -p ci
        cat > ci/Dockerfile <<'EOF'
        FROM ubuntu:24.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y \
            bash sudo curl jq ca-certificates gnupg bats wget \
          && rm -rf /var/lib/apt/lists/*
        WORKDIR /workspace
        EOF

    - name: Build helper image from repo (Ubuntu + bats)
      env:
        DOCKER_BUILDKIT: "0"
      run: docker build -t ci-docker-bats -f ci/Dockerfile .

    - run: |
        ls -l /var/run/docker.sock || true
        docker version
    - run: |
        cat > Dockerfile <<'EOF'
        FROM busybox:1.36
        CMD echo "hello from DinD socket"
        EOF
        docker build -t smoke:dind-sock .
    - run: docker run --rm smoke:dind-sock
    