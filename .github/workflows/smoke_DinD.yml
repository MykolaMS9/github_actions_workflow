name: Smoke (DinD socket)
on: [push, pull_request]

jobs:
  test:
    runs-on: [self-hosted, hetzner]

    container:
      image: ubuntu:24.04
      env:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_HOST: unix:///run/docker.sock
      options: >-
        -v dind-run:/run  
        -v dind-storage:/var/lib/docker

    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --privileged
          -v dind-run:/var/run  
          -v dind-storage:/var/lib/docker

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI in job container
        run: |
          apt-get update -qq
          apt-get install -y docker.io ca-certificates curl git

      - name: Wait for DinD (socket)
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          mount | grep -E ' /run | /var/run ' || true
          for i in $(seq 1 30); do
            if [ -S /run/docker.sock ] && docker version >/dev/null 2>&1; then
              echo "dockerd is up"; exit 0
            fi
            echo "waiting for dockerd ($i/30)…"
            ls -l /run /var/run 2>/dev/null || true
            sleep 2
          done
          echo "dockerd did not come up" >&2
          exit 1
      
      - name: Build helper image from repo (Ubuntu + bats)
        run: docker build -t ci-docker-bats -f ci/Dockerfile .

      - run: |
          ls -l /var/run/docker.sock || true
          docker version
      - run: |
          cat > Dockerfile <<'EOF'
          FROM busybox:1.36
          CMD echo "hello from DinD socket"
          EOF
          docker build -t smoke:dind-sock .
      - run: docker run --rm smoke:dind-sock
      