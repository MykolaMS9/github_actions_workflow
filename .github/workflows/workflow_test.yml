name: Bats Tests (DinD)

on:
  push:
    branches: [master, alpha]
  pull_request:
    branches: [master, alpha]

jobs:
  test:
    runs-on: [self-hosted, hetzner]

    container:
      image: ubuntu:24.04
      env:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_HOST: unix:///run/docker.sock
      options: >-
        -v dind-run:/run  
        -v dind-storage:/var/lib/docker

    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --privileged
          -v dind-run:/var/run  
          -v dind-storage:/var/lib/docker

    steps:
    - uses: actions/checkout@v4

    - name: Install Docker CLI in job container
      run: |
        apt-get update -qq
        apt-get install -y docker.io ca-certificates curl git

    - name: Wait for DinD (socket) & fix perms
      env:
        DOCKER_HOST: unix:///run/docker.sock
      run: |
        echo "DOCKER_HOST=$DOCKER_HOST"
        # чекаємо появи файлу сокета
        for i in $(seq 1 30); do
          if [ -S /run/docker.sock ]; then
            ls -l /run/docker.sock
            chmod 666 /run/docker.sock || true   # ← ключова правка
            break
          fi
          echo "waiting for /run/docker.sock ($i/30)…"
          sleep 2
        done
        # перевіряємо доступність API
        for i in $(seq 1 30); do
          if docker --debug version >/dev/null 2>&1; then
            echo "dockerd is up"; exit 0
          fi
          echo "waiting for dockerd API ($i/30)…"
          # корисно: прямий ping до демона
          (command -v curl >/dev/null 2>&1 && curl --unix-socket /run/docker.sock http://localhost/_ping || true)
          sleep 2
        done
        echo "dockerd did not come up" >&2
        exit 1

    - name: Docker reachable?
      run: docker version && docker info | head -20

    - name: Build helper image from repo (Ubuntu + bats)
      run: docker build -t ci-docker-bats -f ci/Dockerfile .

    - name: Run Bats tests inside DinD (copy workspace)
      run: |
        set -euo pipefail
        CID=$(docker create --workdir /workspace ci-docker-bats bash -lc '
          set -euo pipefail
          command -v bats
          test -d tests || { echo "No tests/ found"; exit 1; }
          find tests -name "*.bats" -exec bats {} +
        ')
        docker cp . "$CID":/workspace
        docker start -a "$CID"
