name: Bats Tests (DinD)

on:
  push:
    branches: [master, alpha]
  pull_request:
    branches: [master, alpha]

jobs:
  test:
    runs-on: [self-hosted, hetzner]

    container:
      image: docker:24-cli
      env:
        DOCKER_TLS_CERTDIR: ""
      options: >-
        -v /opt/ci:/opt/ci
        -v dind-run:/var/run
        -v dind-storage:/var/lib/docker

    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --privileged
          -v dind-run:/var/run
          -v dind-storage:/var/lib/docker

    steps:
      - uses: actions/checkout@v4

      - name: Docker reachable?
        run: docker version && docker info | head -20

      - name: Build helper image (CLI + bats)
        run: docker build -t ci-docker-bats -f /opt/ci/dood-helper.Dockerfile /opt/ci

      - name: Run Bats tests inside DinD (copy workspace)
        run: |
          set -euo pipefail
          CID=$(docker create --workdir /workspace ci-docker-bats bash -lc '
            set -euo pipefail
            chmod +x ./*.sh scripts/*.sh 2>/dev/null || true
            command -v dos2unix >/dev/null 2>&1 && find tests -name "*.bats" -exec dos2unix {} \; || true
            # якщо tests/ немає — вийдемо з дружнім повідомленням
            test -d tests || { echo "No tests/ found"; exit 1; }
            find tests -name "*.bats" -exec bats {} +
          ')
          docker cp . "$CID":/workspace
          docker start -a "$CID"