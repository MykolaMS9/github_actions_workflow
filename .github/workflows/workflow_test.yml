name: Bats Tests (DinD)

on:
  push:
    branches: [master, alpha]
  pull_request:
    branches: [master, alpha]

jobs:
  test:
    runs-on: [self-hosted, hetzner]

    container:
      image: ubuntu:24.04
      env:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_HOST: unix:///run/docker.sock
      options: >-
        -v dind-run:/var/run

    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --group-add 2375
          -v dind-run:/var/run
          -v dind-storage:/var/lib/docker

    steps:
    - uses: actions/checkout@v4

    - name: Install Docker CLI + Buildx (official repo)
      run: |
        set -euo pipefail
        # optional: якщо раніше вже ставив docker.io — прибери, щоб уникнути конфліктів
        apt-get update -qq
        apt-get remove -y docker.io || true

        # офіційний репозиторій Docker
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
        . /etc/os-release
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
          > /etc/apt/sources.list.d/docker.list

        apt-get update -qq
        apt-get install -y docker-ce-cli docker-buildx-plugin docker-compose-plugin ca-certificates curl git

        docker version
        docker buildx version

    - name: Wait for DinD (socket)
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      run: |
        for i in $(seq 1 30); do
          if [ -S /var/run/docker.sock ] && docker version >/dev/null 2>&1; then
            echo "dockerd is up"; exit 0
          fi
          ls -l /var/run/docker.sock || true
          echo "waiting ($i/30)…"
          sleep 2
        done
        exit 1

    - name: Docker reachable?
      run: docker version && docker info | head -20

    - name: Create helper Dockerfile
      run: |
        mkdir -p ci
        cat > ci/Dockerfile <<'EOF'
        FROM ubuntu:24.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y \
            bash sudo curl jq ca-certificates gnupg bats wget \
          && rm -rf /var/lib/apt/lists/*
        WORKDIR /workspace
        EOF

    - name: Build helper image from repo (Ubuntu + bats)
      env:
        DOCKER_BUILDKIT: "1"
      run: docker build -t ci-docker-bats -f ci/Dockerfile .

    - name: Run Bats tests inside DinD (copy workspace)
      run: |
        set -euo pipefail
        CID=$(docker create --workdir /workspace ci-docker-bats bash -lc '
          set -euo pipefail
          command -v bats
          test -d tests || { echo "No tests/ found"; exit 1; }
          find tests -name "*.bats" -exec bats {} +
        ')
        docker cp . "$CID":/workspace
        docker start -a "$CID"
