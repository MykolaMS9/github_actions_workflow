name: Smoke Tests

on: [push, pull_request]

jobs:
  smoke:
    runs-on: [self-hosted, hetzner, docker]
    env:
      DOCKER_HOST: unix:///var/run/docker.sock 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docker is reachable
        run: |
          docker info
          docker version

      - name: Build tiny image
        run: |
          cat > Dockerfile.smoke <<'EOF'
          FROM alpine:3.20
          RUN echo "hello from socket" > /msg.txt
          CMD ["cat", "/msg.txt"]
          EOF
          docker build -t socket-smoke -f Dockerfile.smoke .

      - name: Run image and assert output
        run: |
          OUT="$(docker run --rm socket-smoke)"
          echo "Container said: $OUT"
          test "$OUT" = "hello from socket"

      - name: Cleanup
        if: always()
        run: |
          docker image rm -f socket-smoke || true
